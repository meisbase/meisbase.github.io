---
layout: default
---

{{ content }}

{% assign cv_pdf = "/assets/cv/Mei-Yu_Kuo_CV.pdf" | relative_url %}
{% assign cv_version = site.time | date: "%Y%m%d%H%M" %}

<div class="row g-5 mb-5">
  <div>
    <h3 class="fw-bold border-bottom pb-3 mb-5">CV</h3>

    <!-- CV PDF, built automatically from cv-source/ by .github/workflows/build-cv.yml -->
    <div class="text-center mb-4">
      <object data="{{ cv_pdf }}?v={{ cv_version }}#view=FitH" type="application/pdf"
              width="100%" height="800px" style="border:none;">
        <p>Your browser can't display the PDF here.
          <a href="{{ cv_pdf }}?v={{ cv_version }}" target="_blank">Open the CV</a> instead.</p>
      </object>
    </div>

    <div class="text-center">
      <a href="{{ cv_pdf }}?v={{ cv_version }}" target="_blank" class="btn btn-primary">
        ⬇️ Open/Download CV
      </a>
    </div>
  </div>
</div>
